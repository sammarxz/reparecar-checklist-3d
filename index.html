<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de danos 3D · RepareCar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/viewer.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/damages.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Navegação principal">
      <a class="logo" href="#" aria-label="Ir para a página inicial">
        <img src="assets/logo.webp" alt="Logo RepareCar" width="48" height="48">
      </a>
      <nav class="menu">
        <button data-active aria-label="Gestão de Pátio" title="Gestão de Pátio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/></svg>
        </button>
        <button aria-label="Quadro Geral" title="Quadro Geral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg>
        </button>
        <button aria-label="Calendário" title="Calendário">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        </button>
        <div class="sep" aria-hidden="true"></div>
        <button aria-label="Acesso Rápido" title="Acesso Rápido">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        </button>
        <button aria-label="Notas Fiscais" title="Notas Fiscais">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        </button>
        <button aria-label="Financeiro" title="Financeiro">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </button>
        <div class="sep" aria-hidden="true"></div>
        <button aria-label="Admin" title="Admin">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        </button>
      </nav>
      <div class="avatar" aria-label="Configurações da conta">M</div>
    </aside>

    <main class="page">
      <div class="inner">
        <header class="page-header">
          <button class="back" aria-label="Voltar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </button>
          <h1 id="title">Danos</h1>
        </header>

        <div class="grid">
          <section class="card viewer" aria-label="Modelo 3D do veículo">
            <div class="stage" id="stage">
              <div class="vehicle">
                <div class="vehicle-id">
                  <b id="vName"></b>
                  <div class="vehicle-sub"><span class="status" id="vStatus"></span><span id="vOwner"></span></div>
                </div>
                <ul class="vehicle-meta" id="vMeta"></ul>
              </div>
              <div id="markers"></div>
              <div class="debug" id="debug" hidden></div>
              <div class="loading" id="loading"><div class="spinner"></div><span>Carregando o modelo 3D</span><b>0%</b></div>
            </div>
          </section>

          <aside class="card panel" aria-label="Danos na lataria">
            <div class="body" id="panel"></div>
            <div class="foot">
              <button class="btn" id="btnBack">Voltar</button>
              <button class="btn primary" id="btnNext">Ir para checklist</button>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="scrim"></div>
    <div class="sheet">
      <div class="sheet-head">
        <b id="sheetTitle">Registrar dano</b>
        <button class="sheet-close" id="sheetClose" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
